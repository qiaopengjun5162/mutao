name: CI

on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 安装工具
        run: |
          cargo install taplo-cli
          cargo install cargo-deny
          cargo install typos-cli

      - name: 检查格式
        run: cargo fmt --all -- --check

      - name: TOML 格式检查
        run: taplo fmt --option reorder_keys=true --check

      - name: Clippy 静态分析
        run: cargo clippy --all-targets --all-features --tests -- -D warnings

      - name: 依赖审计
        run: cargo deny check

      - name: 拼写检查
        run: typos

  test:
    name: 测试
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mutao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@llvm-cov

      - name: 初始化测试数据库
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mutao_test
        run: psql -h localhost -U postgres -d mutao_test -f migrations/001_init.sql

      - name: 运行测试
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mutao_test
        run: cargo nextest run --all-features

      - name: 生成覆盖率报告
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mutao_test
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          fail_ci_if_error: false

  python-test:
    name: Python 测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pytest black

      - name: 检查格式
        run: black --check scalpel/

      - name: 运行 Python 测试
        run: cd scalpel && python -m pytest -v

  build:
    name: 构建
    runs-on: ubuntu-latest
    needs: [test, python-test]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建发布版本
        run: cargo build --release --all-features

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mutao
          path: target/release/mutao

  release:
    name: 发布
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 CHANGELOG
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: 发布到 GitHub
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.git-cliff.outputs.content }}
