[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  "RUSTSEC-2024-0363", # sqlx 0.7.4 — 升级到 0.8 成本高，暂时忽略
  "RUSTSEC-2024-0436", # paste 1.0.15 — 间接依赖，暂时忽略
  "RUSTSEC-2024-0370", # proc-macro-error — utoipa v4 间接依赖，暂不升级
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "Zlib",
  "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
allow = []
deny = []
external-default-features = "allow"
highlight = "all"
multiple-versions = "warn"
skip = []
skip-tree = [{ name = "utoipa-swagger-ui" }]
wildcards = "allow"
workspace-default-features = "allow"

[sources]
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "warn"
unknown-registry = "warn"

[sources.allow-org]
bitbucket = []
github = []
gitlab = []
